[project]
name = "primordia"
version = "0.1.0"
description = "Tactical game-state encoding, evaluation, and search design study for the Vindicta Platform"
license = { text = "MIT" }
authors = [
    { name = "Brandon Fox", email = "32090240+brandon-fox@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "numpy>=2.0.0",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"