name: Main Guardian

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  health-check:
    name: Main Branch Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@a6eb1ab5ea3fedf2ec0cef6fc6fc2dafd0fb3225 # v8.0.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --locked --no-build
      - name: Run pytest
        run: uv run --no-sync --no-build pytest
      - uses: First-ADE/.github/.github/actions/ade-axioms@45bd6f8fb984af2be4f1342e9d98de2486b70ecf # main